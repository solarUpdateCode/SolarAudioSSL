name: Build and Release SolarAudioSSL

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Ninja
        run: choco install ninja -y

      - name: Configure CMake (Windows x64)
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_MSVC_RUNTIME_LIBRARY="MultiThreaded$<$<CONFIG:Debug>:Debug>"

      - name: Build SolarAudioSSL (VST3 + Standalone)
        run: cmake --build build --config Release --target SolarAudioSSL_VST3 SolarAudioSSL_Standalone -j

      - name: Verify VST3 Export Symbol
        run: |
          $vst3 = "build/SolarAudioSSL_artefacts/Release/VST3/SolarAudioSSL.vst3/Contents/x86_64-win/SolarAudioSSL.vst3"
          if (!(Test-Path $vst3)) { throw "Missing VST3 binary at $vst3" }
          dumpbin /EXPORTS $vst3 | Select-String "GetPluginFactory"

      - name: Build Windows Installer (Inno Setup)
        run: iscc installer/windows/SolarAudioSSL.iss

      - name: Upload Windows Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SolarAudioSSL-Windows
          path: dist/SolarAudioSSL_1.0.0_Windows_Setup.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake (macOS Universal arm64 + x86_64)
        run: >
          cmake -B build -G Xcode
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Build SolarAudioSSL (AU + VST3 + Standalone)
        run: >
          cmake --build build --config Release
          --target SolarAudioSSL_AU SolarAudioSSL_VST3 SolarAudioSSL_Standalone
          --parallel

      - name: Verify Universal Binaries & AU Validation
        run: |
          lipo -info build/SolarAudioSSL_artefacts/Release/VST3/SolarAudioSSL.vst3/Contents/MacOS/SolarAudioSSL
          lipo -info build/SolarAudioSSL_artefacts/Release/AU/SolarAudioSSL.component/Contents/MacOS/SolarAudioSSL
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R build/SolarAudioSSL_artefacts/Release/AU/SolarAudioSSL.component ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          auval -v aufx Sssl Sola

      - name: Build macOS Installers (.pkg)
        run: |
          chmod +x installer/macos/build_macos_installer.sh
          ./installer/macos/build_macos_installer.sh

      - name: Upload macOS Installer Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SolarAudioSSL-macOS
          path: dist/*.pkg

  release:
    needs: [ build-windows, build-macos ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/SolarAudioSSL-Windows/*.exe
            release-assets/SolarAudioSSL-macOS/*.pkg
